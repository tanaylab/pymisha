{% set name = "pymisha" %}
{% set version = environ.get("PACKAGE_VERSION", "0.1.1") %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.io/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: SET_ON_RELEASE

build:
  number: 1
  skip: true  # [win]

requirements:
  build:
    - {{ compiler("cxx") }}
    - sysroot_linux-64 2.17  # [linux64]
  host:
    - python
    - pip
    - setuptools >=45
    - wheel
    - numpy
    - zlib
  run:
    - python
    - {{ pin_compatible("numpy") }}
    - pandas >=1.3
    - pyyaml
    - zlib
    # samtools is an optional runtime dep used by gtrack_import_mappedseq
    # for direct BAM input. Without it, BAM imports raise a clear error
    # at runtime; SAM / TSV / gzipped imports work unchanged.

test:
  imports:
    - pymisha
    - _pymisha

about:
  home: https://github.com/tanaylab/pymisha
  license: MIT
  license_family: MIT
  license_file: LICENSE
  summary: Python interface for misha genomic databases with C++ streaming backends
  description: |
    PyMisha provides a Python interface for working with misha genomic
    track databases. It includes high-performance C++ streaming backends
    for extraction, iteration, and summarization of genomic interval data.
  dev_url: https://github.com/tanaylab/pymisha
  doc_url: https://tanaylab.github.io/pymisha/

extra:
  recipe-maintainers:
    - aviezerl
