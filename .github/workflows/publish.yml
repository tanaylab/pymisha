name: Build and publish to PyPI

on:
  push:
    tags:
      - "v*"

jobs:
  build_wheels_linux:
    name: Build wheels on Linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pypa/cibuildwheel@v2.22
        env:
          CIBW_BUILD: "cp310-* cp311-* cp312-*"
          CIBW_SKIP: "*-win* *-musllinux* *i686*"
          CIBW_ARCHS: x86_64
          # numpy stopped shipping manylinux2014 (glibc 2.17) x86_64 wheels;
          # the default image would build numpy from source and fail its
          # "GCC >= 10.3" check (devtoolset-10 is 10.2.1). glibc 2.28 = RHEL8+.
          CIBW_MANYLINUX_X86_64_IMAGE: manylinux_2_28
          CIBW_BUILD_VERBOSITY: 1

      - uses: actions/upload-artifact@v7
        with:
          name: wheels-linux
          path: ./wheelhouse/*.whl

  build_wheels_macos:
    name: Build wheels on macOS
    runs-on: macos-14
    # macOS builds are best-effort: python.org rate limits (429) on
    # GitHub's shared runners frequently cause transient failures.
    # Publishing proceeds with Linux wheels + sdist if macOS fails.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v6

      - uses: pypa/cibuildwheel@v2.22
        env:
          CIBW_BUILD: "cp311-* cp312-*"
          CIBW_SKIP: "*-win* *-musllinux* *i686*"
          CIBW_ARCHS: arm64
          CIBW_ENVIRONMENT_MACOS: "MACOSX_DEPLOYMENT_TARGET=11.0"
          CIBW_BUILD_VERBOSITY: 1

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: wheels-macos
          path: ./wheelhouse/*.whl
          if-no-files-found: ignore

  build_sdist:
    name: Build source distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Build sdist
        run: pipx run build --sdist

      - uses: actions/upload-artifact@v7
        with:
          name: sdist
          path: dist/*.tar.gz

  publish:
    name: Publish to PyPI
    needs: [build_wheels_linux, build_wheels_macos, build_sdist]
    # All three build jobs must succeed. macOS was deliberately excluded here,
    # which is how 0.11.0 published Linux-only wheels plus an sdist that could
    # not compile on a Mac: pip fell back to the sdist and failed. A release
    # that cannot build on a supported platform should fail, not ship partially.
    if: always() && needs.build_wheels_linux.result == 'success' && needs.build_wheels_macos.result == 'success' && needs.build_sdist.result == 'success'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - uses: pypa/gh-action-pypi-publish@release/v1
