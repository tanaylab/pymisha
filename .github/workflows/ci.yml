name: ci

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  test-linux:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install samtools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq samtools

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Lint with ruff
        run: ruff check pymisha/

      - name: Type check with mypy
        run: python -m mypy pymisha/

      - name: Run tests
        run: pytest tests/ -x -q --override-ini="addopts=" -n auto --dist loadscope --cov=pymisha --cov-report=term-missing

  libcxx-headers:
    # Compile every translation unit against clang/libc++. conda-forge's macOS
    # toolchain stopped supplying standard headers transitively in Sep 2026, and
    # the resulting "undeclared identifier" breaks only surfaced one file per
    # release (0.12.1, 0.12.2) because nothing here compiles with libc++. This
    # reproduces that strictness in seconds on Linux.
    #
    # Blind spot worth knowing: it does NOT catch Darwin-only gaps such as
    # drand48 needing <stdlib.h>, which glibc still supplies transitively.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install numpy headers
        run: python -m pip install --upgrade pip numpy

      - name: Install clang + libc++
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang libc++-dev libc++abi-dev zlib1g-dev

      - name: Syntax-check every translation unit against libc++
        run: |
          NPY=$(python -c "import numpy; print(numpy.get_include())")
          PY=$(python -c "import sysconfig; print(sysconfig.get_paths()['include'])")
          fail=0
          for f in src/*.cpp; do
            if ! clang++ -fsyntax-only -std=c++17 -stdlib=libc++ \
                 -DPYTHON -DNPY_NO_DEPRECATED_API=NPY_1_7_API_VERSION \
                 -Isrc -I"$NPY" -I"$PY" "$f" 2> /tmp/err.txt; then
              echo "::error file=$f::libc++ syntax check failed"
              grep -E "error:" /tmp/err.txt | head -5
              fail=1
            fi
          done
          exit $fail

  cpp-coverage:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/dev' || github.event_name == 'pull_request'
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lcov samtools
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install numpy pandas pyyaml pytest pyreadr

      - name: Build with coverage instrumentation
        run: PYMISHA_COVERAGE=1 python setup.py build_ext --inplace

      - name: Run tests
        env:
          PYTHONPATH: "."
        run: pytest tests/ -x -q --override-ini="addopts=" --tb=line

      - name: Collect C++ coverage
        run: |
          GCDA_DIR=$(find build/ -name '*.gcda' -printf '%h\n' | sort -u | head -1)
          lcov --capture --directory "$GCDA_DIR" -o cpp-coverage-raw.info --gcov-tool gcov -q
          lcov --remove cpp-coverage-raw.info '/usr/*' '*/numpy/*' '*/python*' \
            -o cpp-coverage.info -q
          echo "### C++ Coverage" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          lcov --summary cpp-coverage.info 2>&1 | tail -3 >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

  test-macos:
    # Only run macOS on PRs and main pushes, not dev pushes
    if: github.ref != 'refs/heads/dev'
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install samtools
        run: brew install samtools

      - name: Install package
        env:
          MACOSX_DEPLOYMENT_TARGET: "11.0"
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Lint with ruff
        run: ruff check pymisha/

      - name: Run tests
        run: pytest tests/ -x -q --override-ini="addopts=" -n auto --dist loadscope
