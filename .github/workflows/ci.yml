name: ci

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

jobs:
  test-linux:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Lint with ruff
        run: ruff check pymisha/

      - name: Type check with mypy
        run: python -m mypy pymisha/

      - name: Run tests
        run: pytest tests/ -x -q --override-ini="addopts=" --cov=pymisha --cov-report=term-missing

  cpp-coverage:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/dev' || github.event_name == 'pull_request'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lcov
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install numpy pandas pyyaml pytest pyreadr

      - name: Build with coverage instrumentation
        run: PYMISHA_COVERAGE=1 python setup.py build_ext --inplace

      - name: Run tests
        env:
          PYTHONPATH: "."
        run: pytest tests/ -x -q --override-ini="addopts=" --tb=line

      - name: Collect C++ coverage
        run: |
          GCDA_DIR=$(find build/ -name '*.gcda' -printf '%h\n' | sort -u | head -1)
          lcov --capture --directory "$GCDA_DIR" -o cpp-coverage-raw.info --gcov-tool gcov -q
          lcov --remove cpp-coverage-raw.info '/usr/*' '*/numpy/*' '*/python*' \
            -o cpp-coverage.info -q
          echo "### C++ Coverage" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          lcov --summary cpp-coverage.info 2>&1 | tail -3 >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

  test-macos:
    # Only run macOS on PRs and main pushes, not dev pushes
    if: github.ref != 'refs/heads/dev'
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package
        env:
          MACOSX_DEPLOYMENT_TARGET: "11.0"
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Lint with ruff
        run: ruff check pymisha/

      - name: Run tests
        run: pytest tests/ -x -q --override-ini="addopts="
