name: ci

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

jobs:
  test-linux:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Lint with ruff
        run: ruff check pymisha/

      - name: Run tests
        run: pytest tests/ -x -q --override-ini="addopts="

  test-macos:
    # Only run macOS on PRs and main pushes, not dev pushes
    if: github.ref != 'refs/heads/dev'
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package
        env:
          MACOSX_DEPLOYMENT_TARGET: "11.0"
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Lint with ruff
        run: ruff check pymisha/

      - name: Run tests
        run: pytest tests/ -x -q --override-ini="addopts="
